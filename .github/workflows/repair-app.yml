name: Repair Screening Advisor UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair UI details
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text(encoding="utf-8")
          old_css = 'html, body, [class*="css"] { font-family: Arial, "Segoe UI", sans-serif; }'
          new_css = old_css + '\n[data-testid="stFileUploaderDropzone"] small { display:none !important; }'
          if old_css in s and '[data-testid="stFileUploaderDropzone"] small' not in s:
              s = s.replace(old_css, new_css, 1)
          old_uploader = '''uploaded=st.file_uploader(\n        "Choose image",\n        type=None,\n        label_visibility="visible"\n    )'''
          new_uploader = '''uploaded=st.file_uploader(\n        "Choose image",\n        type=["jpg", "jpeg", "png", "tiff"],\n        label_visibility="visible"\n    )'''
          if old_uploader in s:
              s = s.replace(old_uploader, new_uploader, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit repair if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No repair changes needed."
          else
            git add app.py
            git commit -m "Fix Lab display and TIFF uploader label"
            git push
          fi
