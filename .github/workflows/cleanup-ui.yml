name: Cleanup Screening Advisor UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Cleanup Screening Advisor UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant UI text and cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    st.caption("Supported formats: JPEG, PNG and TIFF")\n', '')
          s = s.replace('    st.markdown(\'<div class="card">\',unsafe_allow_html=True)\n', '')
          s = s.replace('    st.markdown(\'</div>\',unsafe_allow_html=True)\n', '')
          s = s.replace('    st.markdown(\'<div class="card">\', unsafe_allow_html=True)\n', '')
          s = s.replace('    st.markdown(\'</div>\', unsafe_allow_html=True)\n', '')
          p.write_text(s, encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Cleanup Screening Advisor UI"
            git push
          fi
