name: Apply remove image patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')

          # Hide Streamlit's native helper text.
          s=s.replace('[data-testid="stFileUploaderDropzone"] small { display:none !important; }', '[data-testid="stFileUploaderDropzone"] small, .stFileUploader small { display:none !important; }')

          # Replace only the image uploader widget, regardless of small formatting differences.
          pat=r'''(?ms)(    st\.markdown\("\*\*Image upload\*\*"\)\n)(    uploaded=st\.file_uploader\(.*?\n    \))'''
          m=re.search(pat,s)
          if not m:
              raise SystemExit('Could not locate image uploader block')
          new=(m.group(1)+'''    if "image_uploader_version" not in st.session_state:\n        st.session_state.image_uploader_version = 0\n    uploaded=st.file_uploader(\n        "Choose image",\n        type=["jpg", "jpeg", "png", "tif", "tiff"],\n        label_visibility="visible",\n        key=f"image_uploader_{st.session_state.image_uploader_version}"\n    )''')
          s=s[:m.start()]+new+s[m.end():]

          # Add a real reset button immediately after the preview.
          marker='        st.image(img,caption="Input preview",use_container_width=True)'
          button='''        st.image(img,caption="Input preview",use_container_width=True)\n        if st.button("Remove image", key=f"remove_image_{st.session_state.image_uploader_version}", type="tertiary"):\n            st.session_state.image_uploader_version += 1\n            st.rerun()'''
          if 'key=f"remove_image_{st.session_state.image_uploader_version}"' not in s:
              if marker not in s:
                  raise SystemExit('Could not locate image preview marker')
              s=s.replace(marker,button,1)

          s=s.replace('allowed_suffixes = {".jpg", ".jpeg", ".png", ".tiff"}', 'allowed_suffixes = {".jpg", ".jpeg", ".png", ".tif", ".tiff"}',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/apply-remove-image.yml
          git commit -m "Add remove image control to uploader"
          git push