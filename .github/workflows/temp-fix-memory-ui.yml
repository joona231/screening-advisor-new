name: Optimize Screening Advisor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app.py")
          s = p.read_text(encoding="utf-8")

          # Remove redundant upload-format caption.
          s = s.replace('    st.caption("Supported formats: JPEG, PNG and TIFF")\n', '')

          # Remove the decorative card wrappers around Single tone and Image.
          s = s.replace('    st.markdown(\'<div class="card">\',unsafe_allow_html=True)\n', '')
          s = s.replace('    st.markdown(\'</div>\',unsafe_allow_html=True)\n', '')

          # Keep the uploader functional while avoiding Streamlit's extra format caption.
          s = s.replace('type=None, label_visibility="visible")', 'type=["jpg", "jpeg", "png", "tiff"], label_visibility="visible")')

          # Replace image sampling with a memory-bounded version.
          start = s.find('def image_samples(')
          end = s.find('\ndef predict_image(', start)
          if start != -1 and end != -1:
              new_func = '''def prepare_image_for_analysis(image, max_side=1600):\n    """Downsample before colour conversion to keep Streamlit memory use bounded."""\n    image = image.copy()\n    image.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)\n    return image\n\ndef image_samples(image, max_samples=700):\n    # Never materialize the original full-resolution image as a NumPy array.\n    image = prepare_image_for_analysis(image)\n    arr = np.asarray(image.convert("CMYK"), dtype=np.uint8)\n    c = np.rint(arr.astype(np.float32) / 255 * 25) / 25 * 100\n    flat = c.reshape(-1, 4).astype(np.float32)\n    uniq, counts = np.unique(flat, axis=0, return_counts=True)\n    if len(uniq) > max_samples:\n        idx = np.argsort(counts)[::-1][:max_samples]\n        uniq, counts = uniq[idx], counts[idx]\n    return uniq, counts / counts.sum()\n'''
              s = s[:start] + new_func + s[end:]

          # Ensure RGB/CMYK analysis downsamples before ICC conversion and preview.
          old = '''        img=Image.open(uploaded)\n        if mode.startswith("RGB"):\n            work=rgb_to_cmyk_icc(img)\n            note="RGB input converted with sRGB to FOGRA39 ICC colour management."\n        else:\n            work=img.convert("CMYK")\n            note="CMYK values analysed directly; no RGB conversion was applied."\n        st.image(img,caption="Input preview",use_container_width=True)'''
          new = '''        img=Image.open(uploaded)\n        img=prepare_image_for_analysis(img)\n        if mode.startswith("RGB"):\n            work=rgb_to_cmyk_icc(img)\n            note="RGB input converted with sRGB to FOGRA39 ICC colour management."\n        else:\n            work=img.convert("CMYK")\n            note="CMYK values analysed directly; no RGB conversion was applied."\n        st.image(img,caption="Input preview",use_container_width=True)'''
          if old in s:
              s = s.replace(old, new, 1)

          # Make the ICC transform cache less memory-sensitive by keeping one resource.
          s = s.replace('@st.cache_resource(show_spinner=False)\ndef icc_profiles():', '@st.cache_resource(show_spinner=False, max_entries=1)\ndef icc_profiles():')

          p.write_text(s, encoding="utf-8")

      - name: Commit optimization and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temp-fix-memory-ui.yml
          git add app.py .github/workflows/temp-fix-memory-ui.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Reduce app memory usage and simplify UI"
            git push
          fi
